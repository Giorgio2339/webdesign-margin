<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARGIN. | Hero Signature Prototype</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/lab/hero-signature.css" />
</head>
<body>

  <main class="lab-main">
    <div class="lab-container">
      
      <!-- Left side: static reference -->
      <div class="lab-left">
        <h1>Websites,<br>die man<br>nicht vergisst.</h1>
        <p>Wir gestalten und entwickeln maßgeschneiderte digitale Erlebnisse für Unternehmen mit Anspruch. Präzise, schnell und unverwechselbar.</p>
      </div>

      <!-- Right side: the prototype -->
      <div class="lab-right">
        <div class="signature-wrapper" id="signature-root">
          
          <!-- LAYER 1: Particles (DOM based for easy styling/shadows if needed, or SVG) -->
          <div class="layer-particles" id="particles-container"></div>

          <!-- LAYER 2 & 3: Architectural Lines & Matrix Words (SVG) -->
          <svg viewBox="0 0 1000 1000" class="signature-svg" preserveAspectRatio="xMidYMid meet">
            <defs>
              <mask id="matrix-mask"></mask>
            </defs>

            <!-- ARCHITECTURAL BLUEPRINT LAYER -->
            <g class="layer-blueprint" stroke="#ffffff" fill="none">
              
              <!-- Static Micro Grid -->
              <g class="bp-micro-grid" stroke-width="0.5" stroke-opacity="0.08">
                <!-- generated by JS -->
              </g>

              <!-- Main Axes -->
              <g class="bp-axes" stroke-width="1" stroke-opacity="0.2">
                <line x1="500" y1="0" x2="500" y2="1000" class="bp-axis bp-axis-v" />
                <line x1="0" y1="500" x2="1000" y2="500" class="bp-axis bp-axis-h" />
              </g>

              <!-- Architectural Circles -->
              <g class="bp-circles" stroke-width="1" stroke-opacity="0.15">
                <circle cx="500" cy="500" r="280" class="bp-circle bp-circle-1" stroke-dasharray="4 8" />
                <circle cx="500" cy="500" r="380" class="bp-circle bp-circle-2" stroke-opacity="0.08" />
                <circle cx="500" cy="500" r="150" class="bp-circle bp-circle-3" stroke-dasharray="1 6" stroke-width="2" />
                <circle cx="500" cy="500" r="20" class="bp-circle-center" fill="#ffffff" fill-opacity="0.05" stroke-opacity="0.4" />
              </g>

              <!-- Registration Marks -->
              <g class="bp-reg-marks" id="reg-marks-container">
                <!-- generated by JS -->
              </g>
              
            </g>

            <!-- DOT MATRIX WORD LAYER -->
            <!-- The mask gives it the pixel/dot-matrix look -->
            <g class="layer-words" mask="url(#matrix-mask)" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="500" font-size="140" letter-spacing="0.1em" text-anchor="middle" dominant-baseline="central">
              <text x="500" y="500" class="matrix-word">MARGIN.</text>
              <text x="500" y="500" class="matrix-word">DESIGN</text>
              <text x="500" y="500" class="matrix-word">BRANDING</text>
              <text x="500" y="500" class="matrix-word">DIGITAL</text>
              <text x="500" y="500" class="matrix-word">IDENTITY</text>
            </g>

          </svg>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="/lab/hero-signature.js"></script>
</body>
</html>
